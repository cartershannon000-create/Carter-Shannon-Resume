<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CS Ventures — Control plane</title>
<style>
:root{--bg:#0f1c17;--panel:#16261f;--line:#24382e;--ink:#eaf2ec;--muted:#9fb5a8;
--green:#3ecf8e;--amber:#e3b341;--red:#e5675b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:20px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
a{color:var(--green)}.muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#20342b;color:var(--muted)}
.pill.run{background:#123a2a;color:var(--green)}.pill.gate{background:#3a3113;color:var(--amber)}.pill.fail{background:#3a1a17;color:var(--red)}
.btn{border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:13px;margin-right:6px}
.btn.go{background:var(--green);color:#062015}.btn.no{background:#2a1d1b;color:var(--red)}.btn.rel{background:var(--amber);color:#241d05}
.empty{color:var(--muted);padding:10px}.ev{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:none}
.login{max-width:380px;margin:12vh auto}.login input{width:100%;padding:11px 12px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:#0c1712;color:var(--ink);font-size:15px}
.login .btn{width:100%;margin-top:8px}.err{color:var(--red);min-height:20px;font-size:13px}
#dash{display:none}
</style>
</head>
<body>
<div class="wrap">
  <!-- Login -->
  <div id="login" class="login">
    <h1>CS Ventures — Chief of Staff</h1>
    <p class="muted">Control plane sign-in.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="email" autocomplete="username">
      <input id="password" type="password" placeholder="password" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn go" type="submit">Sign in</button>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dash">
    <div class="top"><h1>Chief of Staff — Control plane</h1>
      <div class="muted"><span id="who"></span> · <a href="#" id="signout">sign out</a></div></div>
    <h2>Pending approvals</h2><div class="card" id="approvals"><div class="empty">loading…</div></div>
    <h2>Ready for release</h2><div class="card" id="release"><div class="empty">loading…</div></div>
    <h2>Work items</h2><div class="card" id="work"><div class="empty">loading…</div></div>
    <h2>Recent events</h2><div class="card" id="events"><div class="empty">loading…</div></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Publishable key + project URL are safe to ship to the browser — access is protected
// server-side by RLS + the is_owner() checks inside the cos.* RPC functions.
const SUPABASE_URL = 'https://dlturcdfemudmwylbpqe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oQF52rpJyHG0AC4iJm9Vvg_hUqOgUWS';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'cos' } });

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function pill(state){let c='';if(['RUNNING','LEASED','COMPLETED','DONE'].includes(state))c='run';
  if(state==='READY_FOR_RELEASE_APPROVAL'||state==='PENDING_PLAN_APPROVAL')c='gate';
  if(['FAILED','BLOCKED','CANCELED'].includes(state))c='fail';return `<span class="pill ${c}">${esc(state)}</span>`;}

let timer=null;
async function showDash(session){
  $('login').style.display='none'; $('dash').style.display='block';
  $('who').textContent=session.user.email;
  await load(); if(timer) clearInterval(timer); timer=setInterval(load,5000);
}
function showLogin(){ if(timer) clearInterval(timer); $('dash').style.display='none'; $('login').style.display='block'; }

async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{}); if(error) throw error; return data;}

window.act = async (fn,args)=>{ try{ await rpc(fn,args); }catch(e){ alert('action failed: '+(e.message||e)); } load(); };

async function load(){
  let d; try{ d=await rpc('api_state'); }catch(e){ if(String(e.message||e).includes('forbidden')){ alert('This account is not authorized.'); } return; }
  const ap=$('approvals');
  ap.innerHTML=d.approvals.length?('<table><tr><th>work</th><th>gate</th><th>plan hash</th><th></th></tr>'+
    d.approvals.map(a=>`<tr><td class=mono>${esc(a.title||a.work_id)}</td><td>${esc(a.gate_type)}</td>
    <td class=mono>${esc((a.payload_hash||'').slice(0,12))}…</td>
    <td><button class="btn go" onclick="act('api_decide_approval',{p_approval_id:'${a.approval_id}',p_approved:true})">Approve</button>
    <button class="btn no" onclick="act('api_decide_approval',{p_approval_id:'${a.approval_id}',p_approved:false})">Reject</button></td></tr>`).join('')+'</table>')
    :'<div class=empty>none</div>';
  const rr=d.work.filter(w=>w.state==='READY_FOR_RELEASE_APPROVAL');
  $('release').innerHTML=rr.length?('<table><tr><th>work</th><th>state</th><th></th></tr>'+
    rr.map(w=>`<tr><td>${esc(w.title)}</td><td>${pill(w.state)}</td>
    <td><button class="btn rel" onclick="act('api_release',{p_work_id:'${w.work_id}'})">Release → Completed</button></td></tr>`).join('')+'</table>')
    :'<div class=empty>nothing awaiting release</div>';
  $('work').innerHTML=d.work.length?('<table><tr><th>title</th><th>state</th><th>priority</th><th>id</th></tr>'+
    d.work.map(w=>`<tr><td>${esc(w.title)}</td><td>${pill(w.state)}</td><td>${esc(w.priority)}</td><td class=mono>${esc(w.work_id)}</td></tr>`).join('')+'</table>')
    :'<div class=empty>no work items</div>';
  $('events').innerHTML=d.events.length?d.events.map(e=>`<div class=ev><span class=muted>${esc(e.created_at)}</span>
    · ${esc(e.actor)} · <b>${esc(e.event_type)}</b> ${e.prior_state?('· '+esc(e.prior_state)+'→'+esc(e.new_state)):''}
    ${e.reason?('· '+esc(e.reason)):''}</div>`).join(''):'<div class=empty>no events</div>';
}

$('loginForm').addEventListener('submit', async (ev)=>{
  ev.preventDefault(); $('loginErr').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error){ $('loginErr').textContent='Invalid email or password.'; return; }
  showDash(data.session);
});
$('signout').addEventListener('click', async (ev)=>{ ev.preventDefault(); await sb.auth.signOut(); showLogin(); });

// Resume an existing session on load.
const { data:{ session } } = await sb.auth.getSession();
if(session) showDash(session); else showLogin();
</script>
</body>
</html>
